name: Events aktualisieren

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kalender abrufen
        run: python scripts/fetch_events.py

      - name: Aenderungen committen
        run: |
          git config user.name "NXTUP Bot"
          git config user.email "actions@github.com"
          git add data/events.json data/venues.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Events aktualisiert"
            git push
          fi
